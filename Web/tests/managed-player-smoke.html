<!doctype html><meta charset="utf-8"><title>TomCat packaged texture smoke</title>
<canvas id="canvas" width="640" height="360"></canvas><pre id="status">loading</pre>
<script type="module">
const out=value=>document.querySelector('#status').textContent=JSON.stringify(value,null,2);
// Observe the real graph created by the native AudioSource. Do not invoke the
// JavaScript backend directly: missing native linkage must fail this fixture.
const contexts=[], gains=[];
const NativeAudioContext=globalThis.AudioContext;
globalThis.AudioContext=class extends NativeAudioContext {
  constructor(options){super(options);contexts.push(this);}
  createGain(){const gain=super.createGain();gains.push(gain);return gain;}
};
try {
  await import('./main.js');
  const engine=globalThis.TomCatWeb.engine;
  const bytes=new Uint8Array(await(await fetch('./multitexture.tcpak')).arrayBuffer());
  const boot=engine.PlayerBoot(640,360,bytes);
  if(boot)throw new Error(`boot ${boot}: ${engine.PlayerError()}`);
  for(let frame=0;frame<10;frame++)engine.PlayerFrame(1/60);
  if(engine.PlayerError())throw new Error(engine.PlayerError());
  if(contexts.length!==1 || !gains.length)throw new Error('Native AudioSource did not create WebAudio output');
  const context=contexts[0], analyser=context.createAnalyser();
  gains[0].connect(analyser);
  globalThis.playerAudioReady=true;
  const deadline=performance.now()+10000;
  let audible=false;
  while(performance.now()<deadline){
    await new Promise(resolve=>setTimeout(resolve,20));
    engine.PlayerFrame(1/60);
    const samples=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(samples);
    if(context.state==='running' && samples.some(value=>Math.abs(value)>.01)){audible=true;break;}
  }
  if(!audible)throw new Error('Cooked AudioSource did not produce a nonzero WebAudio signal after activation');
  engine.PlayerShutdown();
  await new Promise(resolve=>setTimeout(resolve,50));
  if(context.state!=='closed')throw new Error('Player shutdown retained its AudioContext');
  out({ok:true,shutdown:true,boot,frames:10,audible,audioClosed:true});
} catch(error) {out({ok:false,error:String(error?.stack??error)});}
</script>
